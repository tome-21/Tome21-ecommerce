<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Tome21 - E-Commerce Platform</title>
    <meta name="title" content="Tome21 - E-Commerce Platform" />
    <meta
      name="description"
      content="Discover great products, secure checkout, and seamless shopping on Tome21."
    />

    <!-- Favicon & Logo Fixes for Google Search & Browsers -->
    <!-- Note: Google prefers high-res square PNG/ICO icons (at least 48x48px, ideally 512x512px for branding) -->
    <link rel="icon" type="image/jpeg" href="/tome21-logo.jpg" />
    <link rel="apple-touch-icon" href="/tome21-logo.jpg" />

    <!-- Open Graph / Social Media (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tome21.com/" />
    <meta property="og:title" content="Tome21 - E-Commerce Platform" />
    <meta
      property="og:description"
      content="Discover great products, secure checkout, and seamless shopping on Tome21."
    />
    <meta property="og:image" content="https://tome21.com/tome21-logo.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tome21.com/" />
    <meta name="twitter:title" content="Tome21 - E-Commerce Platform" />
    <meta
      name="twitter:description"
      content="Discover great products, secure checkout, and seamless shopping on Tome21."
    />
    <meta name="twitter:image" content="https://tome21.com/tome21-logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
